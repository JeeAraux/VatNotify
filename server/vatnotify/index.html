<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VatTrackr Notify – Einrichtung</title>
<meta name="description" content="VatTrackr Notify schickt dir eine Telegram-Nachricht aufs Handy, sobald dich auf VATSIM ein Lotse in vPilot anschreibt. Kostenlos, in drei Minuten eingerichtet.">
<meta name="theme-color" content="#0F3D2B">
<style>
/* Schriften liegen im Ordner fonts/ (selbst gehostet, keine Abrufe bei Dritten) */
@font-face{font-family:"Chakra Petch";src:url(fonts/chakra-petch-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Chakra Petch";src:url(fonts/chakra-petch-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}

:root{
  /* Die Farben einer Platine: Loetstopplack, Leiterbahn, Bestueckungsdruck, vergoldete Pads, LEDs */
  --mask:#0F3D2B;
  --mask-deep:#0A2D20;
  --trace:#1F6346;
  --trace-live:#3FA96F;
  --silk:#F2F5EE;
  --silk-dim:#A9C0B2;
  --pad:#D8B25A;
  --pad-hi:#E7C778;
  --led-on:#66E993;
  --led-wait:#FFA53D;
  --led-err:#FF6A5E;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mask);color:var(--silk);font:400 1.0625rem/1.55 var(--body)}
[hidden]{display:none !important}
.wrap{max-width:64rem;margin:0 auto;padding:0 1.25rem}
.top,.intro,.alert,.chain,.done,footer{max-width:43.5rem;margin-left:auto;margin-right:auto}
a{color:var(--silk);text-underline-offset:.2em}
:focus-visible{outline:2px solid var(--pad);outline-offset:3px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Kopf */
.top{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 0}
.mark{font:700 1.25rem/1 var(--display);color:var(--silk);text-decoration:none}
.mark span{font-weight:600;color:var(--silk-dim)}
.lang{display:flex}
.lang button{font:600 .8125rem/1 var(--body);background:none;color:var(--silk-dim);border:1px solid var(--trace-live);padding:.45rem .65rem;cursor:pointer}
.lang button:first-child{border-radius:3px 0 0 3px;border-right:0}
.lang button:last-child{border-radius:0 3px 3px 0}
.lang button[aria-pressed="true"]{background:var(--silk);border-color:var(--silk);color:var(--mask-deep)}

/* Einstieg */
.intro{padding:3.25rem 0 3.25rem}
h1{font:700 clamp(2.25rem,6.4vw,3.75rem)/1.04 var(--display);letter-spacing:-.01em;margin:0 0 1.25rem;max-width:17ch;text-wrap:balance}
.lede{font-size:1.25rem;line-height:1.5;max-width:36rem;margin:0 0 .75rem}
.needs{color:var(--silk-dim);margin:0;max-width:36rem}

/* Beispiel-Meldungen: ein Stapel Mitteilungen, wie er auf dem Sperrbildschirm liegt.
   Bewusst in der Systemschrift des Geraets, nicht in der Hausschrift der Seite. */
.pile{margin:2.75rem 0 0;padding:0 .75rem;max-width:23.5rem}
.pile ol{list-style:none;margin:0;padding:0}
.ping{position:relative;display:grid;grid-template-columns:2.375rem minmax(0,1fr);column-gap:.625rem;align-items:start;
  background:rgba(246,247,243,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--mask-deep);
  border-radius:1.375rem;padding:.75rem .9rem 1.5rem .75rem;margin-top:-1rem;
  box-shadow:0 14px 28px -10px rgba(3,20,13,.6),0 2px 6px rgba(3,20,13,.25);
  font:400 .9375rem/1.32 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  transform:rotate(var(--r)) translateX(var(--x));
  animation:drop .6s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i)*130ms + 250ms)}
.ping:first-child{margin-top:0}
.ping:last-child{padding-bottom:.85rem}
.ping:nth-child(1){--i:0;--r:-1.5deg;--x:-.5rem}
.ping:nth-child(2){--i:1;--r:1.1deg;--x:.55rem}
.ping:nth-child(3){--i:2;--r:-.7deg;--x:-.15rem}
.ping:nth-child(4){--i:3;--r:1.5deg;--x:.5rem}
.ping:nth-child(5){--i:4;--r:-1deg;--x:-.55rem}
@keyframes drop{from{opacity:0;translate:0 -1.25rem;scale:.96}}
.ping-icon{width:2.375rem;height:2.375rem;border-radius:.56rem;background:var(--mask);display:grid;place-items:center;position:relative}
.ping-icon::before{content:"";position:absolute;left:.95rem;top:.3rem;width:.5rem;height:.2rem;background:var(--pad);box-shadow:0 1.6rem 0 var(--pad)}
.ping-icon::after{content:"";width:.8rem;height:.8rem;border-radius:50%;background:var(--led-on);box-shadow:0 0 0 .2rem rgba(102,233,147,.22),0 0 .6rem .15rem rgba(102,233,147,.6)}
.ping-head{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem}
.ping-app{font-weight:600}
.ping-time{font-size:.8125rem;color:#5B7366;white-space:nowrap}
.ping-text{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.pile figcaption{margin:1.1rem 0 0;color:var(--silk-dim);font-size:.9375rem}

.alert{border-left:3px solid var(--led-err);background:var(--mask-deep);padding:1rem 1.25rem;margin-bottom:2.5rem;border-radius:0 4px 4px 0}

/* Die Schritte: vier LEDs an einer Leiterbahn, wie die LED-Kette auf dem Board */
.chain{list-style:none;margin-top:0;margin-bottom:0;padding:0}
.step{display:grid;grid-template-columns:2.75rem minmax(0,1fr);position:relative;padding-bottom:2.5rem}
.step::before{content:"";position:absolute;left:8px;top:1.9rem;bottom:-.2rem;width:2px;background:var(--trace);transition:background .6s}
.step:last-child::before{display:none}
.step[data-state="done"]::before{background:var(--trace-live)}
.led{position:absolute;left:0;top:.35rem;width:18px;height:18px;border-radius:3px;background:#E6E2D3;box-shadow:inset 0 0 0 1px rgba(0,0,0,.28);display:grid;place-items:center}
.led::before{content:"";position:absolute;left:5px;top:-4px;width:8px;height:3px;background:var(--pad);box-shadow:0 23px 0 var(--pad)}
.led::after{content:"";width:10px;height:10px;border-radius:50%;background:#7E8E84;transition:background .35s,box-shadow .35s}
.step[data-state="active"] .led::after{background:var(--led-wait);box-shadow:0 0 10px 3px rgba(255,165,61,.5);animation:wait 1.8s ease-in-out infinite}
.step[data-state="done"] .led::after{background:var(--led-on);box-shadow:0 0 0 2px rgba(102,233,147,.25),0 0 14px 5px rgba(102,233,147,.55)}
@keyframes wait{50%{opacity:.45;box-shadow:0 0 4px 1px rgba(255,165,61,.3)}}

.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.25rem 1rem}
h2{font:600 1.5rem/1.25 var(--display);margin:0;scroll-margin-top:1.5rem}
h2:focus{outline:none}
.num{color:var(--silk-dim);margin-right:.6rem;font-variant-numeric:tabular-nums}
.step[data-state="todo"] h2{color:var(--silk-dim);opacity:.7}
.sum{color:var(--silk-dim);margin:.25rem 0 0}
.work{margin-top:1rem;max-width:38rem}
.work>p{margin:0 0 1rem}
.work>:last-child{margin-bottom:0}

/* Bedienelemente: Pads sind golden, alles andere ist Bestueckungsdruck */
.btn{font:600 1rem/1.2 var(--body);border-radius:3px;padding:.75rem 1.15rem;cursor:pointer;border:1px solid transparent;text-decoration:none;display:inline-block}
.btn-pad{background:var(--pad);border-color:var(--pad);color:#18240F}
.btn-pad:hover{background:var(--pad-hi);border-color:var(--pad-hi)}
.btn-silk{background:transparent;color:var(--silk);border-color:var(--silk-dim)}
.btn-silk:hover{border-color:var(--silk)}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;font:inherit;color:var(--silk);text-decoration:underline;text-underline-offset:.2em;cursor:pointer}
.link-dim{color:var(--silk-dim)}
.row{display:flex;flex-wrap:wrap;gap:.75rem 1.25rem;align-items:center}

.status{display:flex;gap:.65rem;align-items:flex-start;color:var(--silk-dim);margin:1.25rem 0 0}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:.5em;background:var(--led-wait);animation:wait 1.8s ease-in-out infinite}
.status[data-kind="ok"]{color:var(--silk)}
.status[data-kind="ok"] .dot{background:var(--led-on);animation:none;box-shadow:0 0 10px 3px rgba(102,233,147,.5)}
.status[data-kind="err"]{color:var(--silk)}
.status[data-kind="err"] .dot{background:var(--led-err);animation:none}

.well{background:var(--mask-deep);border-radius:4px;padding:1.25rem}
.pair{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.5rem;align-items:start}
.qr{background:var(--silk);border-radius:4px;padding:12px;width:12.5rem;height:12.5rem}
.qr svg{display:block;width:100%;height:100%}
.pair p{margin:0 0 1rem}

label{display:block;margin:0 0 .5rem}
input{font:500 1.0625rem/1.2 var(--mono);background:var(--mask-deep);color:var(--silk);border:1px solid var(--silk-dim);border-radius:3px;padding:.7rem .8rem}
input::placeholder{color:#6F8C7C}
#code{font-size:2rem;letter-spacing:.35em;width:10rem;text-align:center;padding:.35rem .2rem .35rem .65rem}
#key{width:min(100%,19rem);text-transform:uppercase}
.note{color:var(--silk-dim);margin:.75rem 0 0}
.warn{color:var(--silk);border-left:3px solid var(--led-err);padding-left:.75rem;margin:.75rem 0 0}

.sub{margin:0 0 1.25rem;padding-left:1.35rem}
.sub li{margin:.6rem 0;padding-left:.25rem}
.sub li::marker{color:var(--silk-dim);font-weight:600}
code{font:500 .95rem/1.4 var(--mono);background:var(--mask-deep);padding:.15rem .4rem;border-radius:3px;overflow-wrap:anywhere}
.copy{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.5rem 0 0}
.copy code{padding:.6rem .75rem}
.copy .btn{padding:.55rem .85rem;font-size:.9375rem}
kbd{font:600 .875rem/1 var(--body);border:1px solid var(--silk-dim);border-radius:3px;padding:.15rem .4rem;white-space:nowrap}

details{margin:1.25rem 0 0}
summary{cursor:pointer;text-decoration:underline;text-underline-offset:.2em;width:fit-content}
details ul{margin:.75rem 0 0;padding-left:1.25rem;color:var(--silk-dim)}
details li{margin:.5rem 0}
details li strong{color:var(--silk);font-weight:600}

/* Abschluss */
.done{padding:.5rem 0 0 2.75rem}
.done h2{font:700 2.25rem/1.1 var(--display);margin:0 0 1rem}
.done ul{list-style:none;margin:0 0 1.5rem;padding:0}
.done li{position:relative;padding-left:1.4rem;margin:.4rem 0}
.done li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--led-on)}
.done h3{font:600 1.125rem/1.3 var(--display);margin:2rem 0 .5rem}
.done p{margin:0 0 1rem;max-width:38rem}
.rule{border-left:3px solid var(--pad);padding-left:1rem}

footer{margin-top:4.5rem;border-top:1px solid var(--trace);padding:1.5rem 0 3rem;color:var(--silk-dim);font-size:.9375rem}
footer p{margin:0 0 .75rem;max-width:40rem}
footer a{color:var(--silk-dim)}
.foot-links{display:flex;flex-wrap:wrap;gap:.25rem 1.5rem}

@media (min-width:62rem){
  .top,.intro{max-width:none}
  .intro{display:grid;grid-template-columns:minmax(0,1fr) 23.5rem;column-gap:3.5rem;align-items:center;padding:2.75rem 0 4rem}
  .pile{margin:0;max-width:none}
}
@media (max-width:35rem){
  .intro{padding:2rem 0 2.5rem}
  .lede{font-size:1.125rem}
  .step{grid-template-columns:2.25rem minmax(0,1fr)}
  .pair{grid-template-columns:minmax(0,1fr)}
  .done{padding-left:0}
  .pile{margin-top:2.25rem;padding:0 .5rem}
  .ping:nth-child(n){--x:0rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <a class="mark" href="https://vattrackr.de/">VatTrackr <span>Notify</span></a>
  <div class="lang" role="group" aria-label="Sprache / Language">
    <button type="button" data-lang="de" aria-pressed="true">DE</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<main>
  <section class="intro">
    <div>
      <h1 data-t="h1"></h1>
      <p class="lede" data-t="lede"></p>
      <p class="needs" data-t="needs"></p>
    </div>
    <figure class="pile" id="pile">
      <ol>
        <li class="ping"><span class="ping-icon" aria-hidden="true"></span><div><div class="ping-head"><span class="ping-app" data-t="demo.app"></span><span class="ping-time" data-t="demo.t1"></span></div><p class="ping-text" data-t="demo.m1"></p></div></li>
        <li class="ping"><span class="ping-icon" aria-hidden="true"></span><div><div class="ping-head"><span class="ping-app" data-t="demo.app"></span><span class="ping-time" data-t="demo.t2"></span></div><p class="ping-text" data-t="demo.m2"></p></div></li>
        <li class="ping"><span class="ping-icon" aria-hidden="true"></span><div><div class="ping-head"><span class="ping-app" data-t="demo.app"></span><span class="ping-time" data-t="demo.t3"></span></div><p class="ping-text" data-t="demo.m3"></p></div></li>
        <li class="ping"><span class="ping-icon" aria-hidden="true"></span><div><div class="ping-head"><span class="ping-app" data-t="demo.app"></span><span class="ping-time" data-t="demo.t4"></span></div><p class="ping-text" data-t="demo.m4"></p></div></li>
        <li class="ping"><span class="ping-icon" aria-hidden="true"></span><div><div class="ping-head"><span class="ping-app" data-t="demo.app"></span><span class="ping-time" data-t="demo.t5"></span></div><p class="ping-text" data-t="demo.m5"></p></div></li>
      </ol>
      <figcaption data-t="demo.caption"></figcaption>
    </figure>
  </section>

  <div class="alert" id="alert" role="alert" hidden></div>

  <ol class="chain" id="chain">

    <!-- 1 Plugin laden -->
    <li class="step" id="s1" data-state="active">
      <div class="rail"><span class="led" aria-hidden="true"></span></div>
      <div>
        <div class="head">
          <h2 tabindex="-1"><span class="num">1</span><span data-t="s1.title"></span></h2>
          <button type="button" class="link link-dim" data-reopen="1" data-t="reopen" hidden></button>
        </div>
        <p class="sum" data-t="s1.sum" hidden></p>
        <div class="work">
          <p data-t="s1.intro"></p>
          <p class="note" id="t-windows" data-t="s1.windows" hidden></p>
          <div class="row">
            <button type="button" class="btn btn-pad" id="b-download" data-t="s1.download"></button>
            <button type="button" class="btn btn-silk" id="b-dl-next" data-next data-t="next" hidden></button>
          </div>
          <div id="p-dl-fallback" hidden>
            <p class="warn" data-t="s1.fallback"></p>
            <p class="row" style="margin-top:1rem">
              <a class="btn btn-silk" id="a-dll" download>VatTrackrNotify.dll</a>
              <a class="btn btn-silk" id="a-ini" download="VatTrackrNotify.ini">VatTrackrNotify.ini</a>
              <a class="btn btn-silk" id="a-cmd" download="Installieren.cmd">Installieren.cmd</a>
              <button type="button" class="btn btn-pad" id="b-fb-next" data-t="next"></button>
            </p>
          </div>
        </div>
      </div>
    </li>

    <!-- 2 Installieren -->
    <li class="step" id="s2" data-state="todo">
      <div class="rail"><span class="led" aria-hidden="true"></span></div>
      <div>
        <div class="head">
          <h2 tabindex="-1"><span class="num">2</span><span data-t="s2.title"></span></h2>
        </div>
        <p class="sum" data-t="s2.sum" hidden></p>
        <div class="work" hidden>
          <ol class="sub">
            <li data-h="s2.a"></li>
            <li data-h="s2.b"></li>
            <li data-t="s2.c"></li>
          </ol>
          <p class="status" id="t-plugin"><span class="dot"></span><span data-t="s2.wait"></span></p>
          <details id="d-manual">
            <summary data-t="s2.manualTitle"></summary>
            <ol class="sub" style="margin-top:.75rem">
              <li data-t="s2.m1"></li>
              <li>
                <span data-h="s2.m2"></span>
                <div class="copy">
                  <code id="t-path">%LOCALAPPDATA%\vPilot\Plugins</code>
                  <button type="button" class="btn btn-silk" data-copy="#t-path" data-t="copy"></button>
                </div>
              </li>
              <li data-h="s2.m3"></li>
              <li data-h="s2.m4"></li>
              <li data-t="s2.m5"></li>
            </ol>
          </details>
          <details id="d-help2">
            <summary data-t="s2.helpTitle"></summary>
            <ul>
              <li data-h="s2.help1"></li>
              <li data-h="s2.help2"></li>
              <li data-h="s2.help3"></li>
            </ul>
          </details>
        </div>
      </div>
    </li>

    <!-- 3 Telegram verbinden -->
    <li class="step" id="s3" data-state="todo">
      <div class="rail"><span class="led" aria-hidden="true"></span></div>
      <div>
        <div class="head">
          <h2 tabindex="-1"><span class="num">3</span><span data-t="s3.title"></span></h2>
        </div>
        <p class="sum" data-t="s3.sum" hidden></p>
        <div class="work" hidden>
          <p class="warn" id="t-fail" data-t="s3.failed" style="margin:0 0 1rem" hidden></p>
          <div id="p-qr">
            <div class="well pair">
              <div class="qr" id="qr" role="img" data-t-aria="s3.qrAlt"></div>
              <div>
                <p data-t="s3.scan"></p>
                <p><a class="btn btn-silk" id="a-open" target="_blank" rel="noopener" data-t="s3.open"></a></p>
                <p class="note" id="t-find"></p>
              </div>
            </div>
            <p class="status"><span class="dot"></span><span data-t="s3.wait"></span></p>
          </div>
          <form id="p-code" hidden>
            <label for="code" data-t="s3.codeIntro"></label>
            <div class="row">
              <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="4" pattern="[0-9]{4}" required>
              <button type="submit" class="btn btn-pad" data-t="s3.confirm"></button>
            </div>
            <p class="warn" id="t-code-err" hidden></p>
          </form>
        </div>
      </div>
    </li>

    <!-- 4 Testen -->
    <li class="step" id="s4" data-state="todo">
      <div class="rail"><span class="led" aria-hidden="true"></span></div>
      <div>
        <div class="head">
          <h2 tabindex="-1"><span class="num">4</span><span data-t="s4.title"></span></h2>
        </div>
        <p class="sum" data-t="s4.sum" hidden></p>
        <div class="work" hidden>
          <p class="status" id="t-linked" style="margin:0 0 1.25rem"><span class="dot"></span><span id="t-linked-text"></span></p>
          <p data-t="s4.intro"></p>
          <button type="button" class="btn btn-pad" id="b-test" data-t="s4.send"></button>
          <p class="status" id="t-test" hidden><span class="dot"></span><span id="t-test-text"></span></p>
          <div id="p-ask" hidden>
            <p style="margin:1.25rem 0 .75rem" data-t="s4.ask"></p>
            <div class="row">
              <button type="button" class="btn btn-pad" id="b-yes" data-t="s4.yes"></button>
              <button type="button" class="btn btn-silk" id="b-no" data-t="s4.no"></button>
            </div>
          </div>
          <details id="d-help4">
            <summary data-t="s4.helpTitle"></summary>
            <ul>
              <li data-h="s4.help1"></li>
              <li data-h="s4.help2"></li>
              <li data-h="s4.help3"></li>
              <li data-h="s4.help4"></li>
            </ul>
          </details>
        </div>
      </div>
    </li>
  </ol>

  <section class="done" id="done" hidden>
    <h2 tabindex="-1" data-t="done.title"></h2>
    <p data-t="done.lede"></p>
    <ul>
      <li data-t="done.l1"></li>
      <li data-t="done.l2"></li>
      <li data-t="done.l3"></li>
      <li data-t="done.l4"></li>
    </ul>
    <p class="rule" data-h="done.rule"></p>
    <h3 data-t="done.toneTitle"></h3>
    <p data-t="done.tone"></p>
    <h3 data-t="done.manageTitle"></h3>
    <p data-h="done.m1"></p>
    <p data-h="done.m2"></p>
    <h3 data-t="done.updateTitle"></h3>
    <p data-h="done.update"></p>

  api: 'api.php',            // Adresse von api.php; absolut angeben, wenn diese Seite auf einer anderen Domain liegt
  files: 'download/',        // Ordner mit VatTrackrNotify.dll und VatTrackrNotify.zip
  privacy: 'https://vattrackr.de/datenschutz.php',   // leer = Link wird nicht gezeigt

};

/* Dateien fuers Paket. Sie werden beim Bau der Seite eingebettet (web/build.sh), damit der
   Download nicht davon abhaengt, ob der Server .ini-, .cmd- und .txt-Dateien ausliefert. */
var FILE_INI = "; VatTrackr Notify - Einstellungen / settings\r\n; Einrichtung / setup: https://vattrackr.de/vatnotify/\r\n\r\n[VatTrackrNotify]\r\n\r\n; Beides traegt die Einrichtung selbst ein. / Both are filled in by the setup.\r\nKey=\r\nPair=\r\n\r\n; Adresse des Dienstes, bitte nicht aendern / service address, please do not change\r\nServer=https://vattrackr.de/vatnotify/api.php\r\n";
var FILE_CMD = "@echo off\r\nsetlocal\r\ntitle VatTrackr Notify\r\necho.\r\necho   VatTrackr Notify - Installation\r\necho   ===============================\r\necho.\r\n\r\nrem Dieses Skript kopiert das Plugin in den Plugins-Ordner von vPilot und hebt die\r\nrem Sperre auf, die Windows auf heruntergeladene Dateien legt. Es aendert sonst nichts.\r\n\r\nset \"SRC=%~dp0\"\r\nif not exist \"%SRC%VatTrackrNotify.dll\" goto :notunzipped\r\n\r\nrem --- vPilot-Ordner suchen: erst der Eintrag von vPilot selbst, dann der uebliche Ort\r\nset \"VP=\"\r\nreg query \"HKCU\\Software\\vPilot\" /v Install_Dir >nul 2>&1\r\nif errorlevel 1 goto :usual\r\nfor /f \"tokens=2,*\" %%a in ('reg query \"HKCU\\Software\\vPilot\" /v Install_Dir') do if /i \"%%a\"==\"REG_SZ\" set \"VP=%%b\"\r\nif not defined VP goto :usual\r\nif exist \"%VP%\\vPilot.exe\" goto :found\r\n:usual\r\nset \"VP=%LOCALAPPDATA%\\vPilot\"\r\n:found\r\nif not exist \"%VP%\\vPilot.exe\" goto :novpilot\r\n\r\nrem --- vPilot darf nicht laufen, sonst ist die Datei gesperrt\r\nset \"RUNNING=\"\r\ntasklist /fi \"imagename eq vPilot.exe\" /nh >\"%TEMP%\\vtn-tasks.txt\" 2>nul\r\nfor /f \"usebackq tokens=1\" %%a in (\"%TEMP%\\vtn-tasks.txt\") do if /i \"%%a\"==\"vPilot.exe\" set \"RUNNING=1\"\r\ndel \"%TEMP%\\vtn-tasks.txt\" >nul 2>&1\r\nif defined RUNNING goto :running\r\n\r\nrem --- Update: eine vorhandene Einstellungsdatei mit Schluessel bleibt erhalten. Kommt das\r\nrem     Paket frisch von der Einrichtungsseite (Pair= ist gefuellt), wird sie ersetzt.\r\nset \"KEEP=\"\r\nset \"OLDKEY=\"\r\nset \"NEWPAIR=\"\r\nif not exist \"%VP%\\Plugins\\VatTrackrNotify.ini\" goto :copy\r\nfor /f \"usebackq tokens=1,* delims==\" %%a in (\"%VP%\\Plugins\\VatTrackrNotify.ini\") do if /i \"%%a\"==\"Key\" if not \"%%b\"==\"\" set \"OLDKEY=1\"\r\nfor /f \"usebackq tokens=1,* delims==\" %%a in (\"%SRC%VatTrackrNotify.ini\") do if /i \"%%a\"==\"Pair\" if not \"%%b\"==\"\" set \"NEWPAIR=1\"\r\nif not defined OLDKEY goto :copy\r\nif defined NEWPAIR goto :copy\r\nset \"KEEP=1\"\r\n\r\n:copy\r\nif not exist \"%VP%\\Plugins\" mkdir \"%VP%\\Plugins\"\r\ncopy /y \"%SRC%VatTrackrNotify.dll\" \"%VP%\\Plugins\\\" >nul\r\nif errorlevel 1 goto :copyfailed\r\nif defined KEEP goto :unblock\r\ncopy /y \"%SRC%VatTrackrNotify.ini\" \"%VP%\\Plugins\\\" >nul\r\nif errorlevel 1 goto :copyfailed\r\n\r\n:unblock\r\nrem --- Sperre fuer heruntergeladene Dateien aufheben, sonst laedt vPilot die DLL nicht\r\nset \"VTN_DLL=%VP%\\Plugins\\VatTrackrNotify.dll\"\r\npowershell -NoProfile -Command \"Unblock-File -LiteralPath $env:VTN_DLL\" >nul 2>&1\r\npowershell -NoProfile -Command \"if (Get-Item -LiteralPath $env:VTN_DLL -Stream Zone.Identifier -ErrorAction SilentlyContinue) { exit 1 } else { exit 0 }\" >nul 2>&1\r\nif errorlevel 1 goto :blocked\r\n\r\necho   Fertig. Das Plugin liegt in:\r\necho   Done. The plugin is in:\r\necho     %VP%\\Plugins\r\necho.\r\nif defined KEEP goto :updated\r\necho   Starte jetzt vPilot. Die Einrichtung geht im Browser weiter.\r\necho   Now start vPilot. The setup continues in your browser.\r\necho.\r\npause\r\nexit /b 0\r\n\r\n:updated\r\necho   Deine bisherige Einrichtung bleibt erhalten. Starte jetzt vPilot.\r\necho   Your existing setup is kept. Now start vPilot.\r\necho.\r\npause\r\nexit /b 0\r\n\r\n:notunzipped\r\necho   Bitte zuerst das Paket entpacken: Rechtsklick auf die ZIP-Datei, \"Alle extrahieren\".\r\necho   Dann diese Datei im entpackten Ordner noch einmal starten.\r\necho.\r\necho   Please unzip the package first: right-click the ZIP file, \"Extract all\".\r\necho   Then run this file again from the unzipped folder.\r\ngoto :failed\r\n\r\n:novpilot\r\necho   vPilot wurde nicht gefunden. Ist es installiert?\r\necho   vPilot was not found. Is it installed?\r\ngoto :failed\r\n\r\n:running\r\necho   vPilot laeuft noch. Bitte vPilot beenden und diese Datei noch einmal starten.\r\necho   vPilot is still running. Please close vPilot and run this file again.\r\ngoto :failed\r\n\r\n:copyfailed\r\necho   Die Dateien liessen sich nicht kopieren nach:\r\necho   The files could not be copied to:\r\necho     %VP%\\Plugins\r\ngoto :failed\r\n\r\n:blocked\r\necho   Die Dateien sind kopiert, aber Windows sperrt die DLL noch.\r\necho   Bitte von Hand freigeben: Rechtsklick auf VatTrackrNotify.dll, \"Eigenschaften\",\r\necho   unten den Haken bei \"Zulassen\" setzen, OK. Der Ordner:\r\necho.\r\necho   The files are copied, but Windows still blocks the DLL.\r\necho   Please unblock it by hand: right-click VatTrackrNotify.dll, \"Properties\",\r\necho   tick \"Unblock\" at the bottom, OK. The folder:\r\necho     %VP%\\Plugins\r\ngoto :failed\r\n\r\n:failed\r\necho.\r\npause\r\nexit /b 1\r\n";
var FILE_README = "VatTrackr Notify 1.1.0 - vPilot plugin\r\n======================================\r\n\r\nDEUTSCH\r\n-------\r\nSchickt dir eine Telegram-Nachricht aufs Handy, sobald dich auf VATSIM ein Lotse\r\nanschreibt (Contact me), dich jemand privat anschreibt, ein SELCAL kommt oder die\r\nVerbindung abbricht.\r\n\r\nSo geht es:\r\n  1. vPilot beenden.\r\n  2. Dieses Paket entpacken (Rechtsklick auf die ZIP-Datei, \"Alle extrahieren\").\r\n  3. Im entpackten Ordner \"Installieren.cmd\" doppelt anklicken. Fragt Windows nach,\r\n     bestaetige mit \"Ausfuehren\".\r\n  4. vPilot starten. Die Einrichtungsseite oeffnet sich im Browser, falls sie nicht\r\n     schon offen ist. Dort verbindest du Telegram: QR-Code scannen, Code eingeben, fertig.\r\n\r\nDie Anleitung mit Bildern:  https://vattrackr.de/vatnotify/\r\n\r\nLieber von Hand?\r\n  VatTrackrNotify.dll und VatTrackrNotify.ini in den Plugins-Ordner von vPilot legen:\r\n    %LOCALAPPDATA%\\vPilot\\Plugins\r\n  Dann Rechtsklick auf VatTrackrNotify.dll > Eigenschaften > unten den Haken bei\r\n  \"Zulassen\" setzen > OK. Windows sperrt heruntergeladene DLL-Dateien, und vPilot\r\n  laedt das Plugin sonst nicht.\r\n\r\nKontrolle: Nach dem Start von vPilot liegt im Plugins-Ordner die Datei\r\nVatTrackrNotify.log. Darin steht, ob das Plugin laeuft. Fehlt die Datei, hat vPilot\r\ndas Plugin nicht geladen.\r\n\r\nUpdate: vPilot beenden, das neue Paket entpacken und \"Installieren.cmd\" starten.\r\nDeine Verbindung zu Telegram bleibt dabei bestehen.\r\n\r\nWas gemeldet wird, stellst du im Bot mit /settings ein.\r\nAbmelden und alle Daten loeschen: dem Bot /stop schicken und beide Dateien aus dem\r\nPlugins-Ordner entfernen.\r\n\r\nWichtig: Die Benachrichtigung ersetzt nicht deine Anwesenheit. Es gelten die VATSIM-Regeln\r\nzu unbeaufsichtigten Verbindungen; auf eine Kontaktaufforderung musst du zuegig reagieren.\r\n\r\n\r\nENGLISH\r\n-------\r\nSends a Telegram message to your phone as soon as a controller messages you on VATSIM\r\n(contact me), someone sends you a private message, a SELCAL arrives or the connection drops.\r\n\r\nHow to set it up:\r\n  1. Close vPilot.\r\n  2. Unzip this package (right-click the ZIP file, \"Extract all\").\r\n  3. In the unzipped folder, double-click \"Installieren.cmd\". If Windows asks,\r\n     confirm with \"Run\".\r\n  4. Start vPilot. The setup page opens in your browser unless it is open already.\r\n     Connect Telegram there: scan the QR code, enter the code, done.\r\n\r\nThe guide with pictures:  https://vattrackr.de/vatnotify/\r\n\r\nRather by hand?\r\n  Put VatTrackrNotify.dll and VatTrackrNotify.ini into vPilot's Plugins folder:\r\n    %LOCALAPPDATA%\\vPilot\\Plugins\r\n  Then right-click VatTrackrNotify.dll > Properties > tick \"Unblock\" at the bottom > OK.\r\n  Windows blocks downloaded DLL files, and vPilot will not load the plugin otherwise.\r\n\r\nCheck: after vPilot has started, the Plugins folder contains the file\r\nVatTrackrNotify.log. It says whether the plugin is running. If the file is missing,\r\nvPilot did not load the plugin.\r\n\r\nUpdating: close vPilot, unzip the new package and run \"Installieren.cmd\". Your\r\nTelegram connection stays in place.\r\n\r\nChoose what is reported with /settings in the bot.\r\nTo sign off and delete all your data: send /stop to the bot and remove both files from\r\nthe Plugins folder.\r\n\r\nImportant: a notification does not replace being there. VATSIM's rules on unattended\r\nconnections apply; you must respond promptly to a contact request.\r\n";

};

/* ------------------------------------------------------------------ Zustand */
var STORE = 'vtn-setup';
var TOKEN_LIFE = 55 * 60 * 1000;      // der Server gibt einer Einrichtung 60 Minuten
var state = { lang: 'de', langSet: false, token: '', tokenAt: 0, downloaded: false, key: '', tested: false };
var live = { bot: '', latest: '', plugin: false, seen: false, version: '', open: 0, sub: 'qr', qrFor: '',
             pairTimer: 0, statusTimer: 0, linkSince: 0 };

function load() {
  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || '{}');
    for (var k in state) { if (Object.prototype.hasOwnProperty.call(saved, k)) state[k] = saved[k]; }
  } catch (e) { /* ohne Speicher laeuft die Seite trotzdem */ }
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { }
}

/* ------------------------------------------------------------------ Hilfen */
function $(sel) { return document.querySelector(sel); }
function all(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
function show(sel, on) { var el = typeof sel === 'string' ? $(sel) : sel; if (el) el.hidden = !on; }
function t(id, vars) {
  var s = (TEXT[state.lang] && TEXT[state.lang][id]) || TEXT.en[id] || id;
  if (vars) { for (var k in vars) { s = s.split('{' + k + '}').join(String(vars[k])); } }
  return s;
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function say(text) { $('#live').textContent = text; }

function api(action, params) {
  var body = new URLSearchParams();
  body.set('action', action);
  for (var k in (params || {})) body.set(k, params[k]);
  return fetch(CONFIG.api, { method: 'POST', body: body, cache: 'no-store' }).then(function (res) {
    return res.json().then(function (data) { data.http = res.status; return data; },
                           function () { return { ok: false, http: res.status, error: 'server' }; });
  }, function () { return { ok: false, http: 0, error: 'offline' }; });
}

function alertBox(id) {
  var box = $('#alert');
  if (!id) { box.hidden = true; return; }
  box.textContent = t(id);
  box.dataset.id = id;
  box.hidden = false;
}

/* ------------------------------------------------------------------ Sprache */
function applyTexts() {
  document.documentElement.lang = state.lang;
  document.title = t('title');
  all('[data-t]').forEach(function (el) { el.textContent = t(el.dataset.t); });
  all('[data-h]').forEach(function (el) { el.innerHTML = t(el.dataset.h, { pkg: CONFIG.files + 'VatTrackrNotify.zip' }); });
  all('[data-t-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.dataset.tAria)); });
  all('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)); });
  if ($('#alert').dataset.id && !$('#alert').hidden) $('#alert').textContent = t($('#alert').dataset.id);
  $('#t-find').textContent = live.bot ? t('s3.find', { bot: live.bot }) : '';
  $('#t-version').textContent = live.latest ? t('foot.version', { v: live.latest }) : '';
  render();
}

/* ------------------------------------------------------------------ Darstellung der Schritte
   1 Paket geladen · 2 Plugin gefunden · 3 Telegram verbunden · 4 getestet und Plugin gemeldet */
function doneFlags() {
  var d3 = !!state.key;
  var d1 = d3 || state.downloaded;
  var d2 = d3 || (d1 && live.plugin);
  var d4 = d3 && state.tested && live.seen;
  return [d1, d2, d3, d4];
}
function current() {
  var d = doneFlags();
  for (var i = 0; i < 4; i++) { if (!d[i]) return i + 1; }
  return 5;
}
function pairLink() { return 'https://t.me/' + live.bot + '?start=' + state.token; }

function render() {
  var d = doneFlags();
  var cur = current();
  var open = live.open && live.open < cur ? live.open : cur;
  for (var i = 1; i <= 4; i++) {
    var li = $('#s' + i);
    var isDone = d[i - 1];
    li.dataset.state = isDone ? 'done' : (i === cur ? 'active' : 'todo');
    show(li.querySelector('.work'), i === open);
    show(li.querySelector('.sum'), isDone && i !== open);
    var re = li.querySelector('[data-reopen]');
    if (re) show(re, isDone && i !== open && !state.key);
  }
  show('#done', cur === 5);

  // Schritt 1
  show('#t-windows', !/Windows/i.test(navigator.userAgent));
  show('#b-dl-next', d[0] && open === 1 && cur !== 1);

  // Schritt 3
  show('#p-qr', live.sub !== 'code');
  show('#p-code', live.sub === 'code');
  show('#t-fail', live.sub === 'fail');
  if (open === 3 && state.token && live.bot && live.qrFor !== state.token) {
    drawQr(pairLink());
    $('#a-open').href = pairLink();
    live.qrFor = state.token;
  }

  // Schritt 4
  $('#t-linked').dataset.kind = live.seen ? 'ok' : '';
  $('#t-linked-text').textContent = live.seen ? t('s4.linkOk', { v: live.version || '?' }) : t('s4.linkWait');

  schedule();
}

function focusStep(n) {
  var el = n === 5 ? $('#done h2') : $('#s' + n + ' h2');
  if (el) { el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
}
function advance(message) {
  live.open = 0;
  render();
  if (message) say(message);
  focusStep(current());
}

/* ------------------------------------------------------------------ Schritt 1: Paket bauen (ZIP ohne Kompression) */
var CRC = (function () {
  var table = [];
  for (var n = 0; n < 256; n++) {
    var c = n;
    for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[n] = c >>> 0;
  }
  return table;
})();
function crc32(bytes) {
  var crc = 0xFFFFFFFF;
  for (var i = 0; i < bytes.length; i++) crc = CRC[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function zip(files) {
  var enc = new TextEncoder();
  var now = new Date();
  var time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  var date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  var local = [], central = [], offset = 0, centralSize = 0;
  files.forEach(function (f) {
    var name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    var h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true);
    h.setUint16(10, time, true); h.setUint16(12, date, true);
    h.setUint32(14, crc, true); h.setUint32(18, size, true); h.setUint32(22, size, true);
    h.setUint16(26, name.length, true);
    local.push(new Uint8Array(h.buffer), name, f.data);
    var c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true);
    c.setUint16(12, time, true); c.setUint16(14, date, true);
    c.setUint32(16, crc, true); c.setUint32(20, size, true); c.setUint32(24, size, true);
    c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
    central.push(new Uint8Array(c.buffer), name);
    offset += 30 + name.length + size;
    centralSize += 46 + name.length;
  });
  var end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, centralSize, true); end.setUint32(16, offset, true);
  return new Blob(local.concat(central, [new Uint8Array(end.buffer)]), { type: 'application/zip' });
}

/* Die Einstellungsdatei bekommt das Token dieser Einrichtung und die Adresse des Dienstes,
   passend zum Ort dieser Seite. Den Schluessel holt sich das Plugin spaeter selbst. */
function iniFor(token) {
  var server = new URL(CONFIG.api, location.href).href;
  return FILE_INI.replace(/^Pair=.*$/m, 'Pair=' + token).replace(/^Server=.*$/m, 'Server=' + server);
}
function saveBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 60000);
}

function ensureToken() {
  if (state.token && Date.now() - state.tokenAt < TOKEN_LIFE) return Promise.resolve(true);
  return api('pair_start').then(function (r) {
    if (!r.ok) {
      alertBox(r.http === 429 ? 'err.rate' : (r.error === 'offline' ? 'err.offline' : 'err.setup'));
      return false;
    }
    state.token = r.token;
    state.tokenAt = Date.now();
    live.plugin = false;
    live.sub = 'qr';
    save();
    return true;
  });
}

function download() {
  var btn = $('#b-download');
  var restore = function () { btn.disabled = false; btn.textContent = t('s1.download'); };
  btn.disabled = true;
  btn.textContent = t('s1.building');
  show('#p-dl-fallback', false);
  alertBox('');
  ensureToken().then(function (ok) {
    if (!ok) { restore(); return; }
    var enc = new TextEncoder();
    var ini = enc.encode(iniFor(state.token));
    fetch(CONFIG.files + 'VatTrackrNotify.dll', { cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('dll'); return res.arrayBuffer(); })
      .then(function (buf) {
        var dll = new Uint8Array(buf);
        if (dll.length < 1024 || dll[0] !== 0x4D || dll[1] !== 0x5A) throw new Error('dll');
        saveBlob(zip([
          { name: 'Installieren.cmd', data: enc.encode(FILE_CMD) },
          { name: 'VatTrackrNotify.dll', data: dll },
          { name: 'VatTrackrNotify.ini', data: ini },
          { name: 'README.txt', data: enc.encode(FILE_README) }
        ]), 'VatTrackrNotify.zip');
        state.downloaded = true;
        save();
        restore();
        advance(t('s1.sum'));
      })
      .catch(function () {
        // Ersatzweg: die drei Dateien einzeln anbieten
        $('#a-dll').href = CONFIG.files + 'VatTrackrNotify.dll';
        $('#a-ini').href = URL.createObjectURL(new Blob([ini], { type: 'text/plain' }));
        $('#a-cmd').href = URL.createObjectURL(new Blob([enc.encode(FILE_CMD)], { type: 'text/plain' }));
        show('#p-dl-fallback', true);
        restore();
        say(t('s1.fallback'));
      });
  });
}
function fallbackDone() {
  state.downloaded = true;
  save();
  show('#p-dl-fallback', false);
  advance(t('s1.sum'));
}

/* ------------------------------------------------------------------ Schritte 2 und 3: Plugin gefunden? Telegram verbunden? */
function drawQr(text) {
  var qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  var n = qr.getModuleCount();
  var path = '';
  for (var r = 0; r < n; r++) {
    for (var c = 0; c < n; c++) { if (qr.isDark(r, c)) path += 'M' + c + ' ' + r + 'h1v1h-1z'; }
  }
  $('#qr').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges"><path fill="#0A2D20" d="' + path + '"/></svg>';
}

function pollPair() {
  if (state.key || !state.token) return;
  api('pair_status', { token: state.token }).then(function (r) {
    if (state.key || !state.token || !r.ok) return;
    if (r.status === 'expired') { expire(); return; }
    if (r.status === 'done' && r.key) { paired(r.key); return; }
    var found = !!r.plugin && !live.plugin;
    if (found) live.plugin = true;
    var sub = r.status === 'code' ? 'code' : (r.status === 'failed' ? 'fail' : 'qr');
    var changed = sub !== live.sub;
    live.sub = sub;
    if (found) { advance(t('s2.sum')); }
    else if (changed) { render(); }
    if (changed && sub === 'code') {
      $('#code').value = '';
      show('#t-code-err', false);
      $('#code').focus();
      say(t('s3.codeIntro'));
    } else if (changed && sub === 'fail') {
      say(t('s3.failed'));
    }
  });
}
function expire() {
  state.token = '';
  state.downloaded = false;
  live.plugin = false;
  live.sub = 'qr';
  live.qrFor = '';
  save();
  alertBox('err.expired');
  advance(t('err.expired'));
}
function paired(key) {
  state.key = key;
  state.token = '';
  state.tested = false;
  live.seen = false;
  live.version = '';
  live.linkSince = Date.now();
  save();
  resetTestUi();
  advance(t('s3.sum'));
}

function confirmCode(ev) {
  ev.preventDefault();
  var code = $('#code').value.replace(/\D/g, '');
  if (code.length !== 4) return;
  show('#t-code-err', false);
  api('pair_confirm', { token: state.token, code: code }).then(function (r) {
    if (r.ok && r.key) { paired(r.key); return; }
    if (r.error === 'wrong_code') {
      $('#t-code-err').textContent = t('s3.wrong', { n: r.left });
      show('#t-code-err', true);
      $('#code').value = '';
      $('#code').focus();
      return;
    }
    if (r.error === 'offline') { alertBox('err.offline'); return; }
    if (r.status === 'failed') { live.sub = 'fail'; render(); say(t('s3.failed')); return; }
    if (r.status === 'expired') { expire(); }
  });
}

function resetAll() {
  state = { lang: state.lang, langSet: state.langSet, token: '', tokenAt: 0, downloaded: false, key: '', tested: false };
  live.plugin = false; live.seen = false; live.version = ''; live.open = 0; live.sub = 'qr'; live.qrFor = '';
  save();
  resetTestUi();
  show('#p-dl-fallback', false);
  render();
  focusStep(1);
}

/* ------------------------------------------------------------------ Schritt 4: Plugin gemeldet? Testnachricht */
function pollStatus() {
  if (!state.key) return;
  api('status', { key: state.key }).then(function (r) {
    if (!state.key) return;
    if (r.http === 401) { staleKey(); return; }
    if (!r.ok) return;
    var was = live.seen;
    live.seen = !!r.seen;
    live.version = r.version || '';
    if (live.seen && !was) {
      if (current() === 5) advance(t('done.title')); else { render(); say(t('s4.linkOk', { v: live.version || '?' })); }
    } else if (!live.seen && live.linkSince && Date.now() - live.linkSince > 30000) {
      $('#d-help4').open = true;      // dauert laenger als erwartet: Hilfe von selbst aufklappen
      live.linkSince = 0;
    }
  });
}
function staleKey() {
  resetAll();
  alertBox('err.stale');
}

function resetTestUi() {
  show('#t-test', false);
  show('#p-ask', false);
  $('#b-test').textContent = t('s4.send');
  $('#b-test').dataset.t = 's4.send';
}
function sendTest() {
  var btn = $('#b-test'), line = $('#t-test'), text = $('#t-test-text');
  btn.disabled = true;
  line.dataset.kind = '';
  text.textContent = t('s4.sending');
  show(line, true);
  api('test', { key: state.key }).then(function (r) {
    btn.disabled = false;
    if (r.ok) {
      line.dataset.kind = 'ok';
      text.textContent = t('s4.sent');
      btn.dataset.t = 's4.again';
      btn.textContent = t('s4.again');
      show('#p-ask', true);
      say(t('s4.sent'));
      return;
    }
    line.dataset.kind = 'err';
    if (r.http === 401 || r.http === 410) {
      text.textContent = t('s4.gone');
      setTimeout(staleKey, 4000);
    } else {
      text.textContent = t(r.http === 429 ? 's4.rate' : 'err.offline');
    }
    say(text.textContent);
  });
}
function testArrived() {
  state.tested = true;
  save();
  show('#p-ask', false);
  if (live.seen) { advance(t('done.title')); }
  else { render(); say(t('s4.linkWait')); }
}

/* ------------------------------------------------------------------ Abfragen takten */
function schedule() {
  // Laeuft auch im Hintergrund weiter: das Plugin oeffnet die Seite neu, wenn sie laenger nicht fragt.
  var needPair = !state.key && !!state.token && state.downloaded;
  if (needPair && !live.pairTimer) live.pairTimer = setInterval(pollPair, 2000);
  if (!needPair && live.pairTimer) { clearInterval(live.pairTimer); live.pairTimer = 0; }

  var needStatus = !!state.key && !live.seen;
  if (needStatus && !live.statusTimer) live.statusTimer = setInterval(pollStatus, 3000);
  if (!needStatus && live.statusTimer) { clearInterval(live.statusTimer); live.statusTimer = 0; }
}

/* ------------------------------------------------------------------ Start */
function copyFrom(btn) {
  var text = $(btn.dataset.copy).textContent;
  var done = function () {
    btn.textContent = t('copied');
    setTimeout(function () { btn.textContent = t('copy'); }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text); done(); });
  } else { legacyCopy(text); done(); }
}
function legacyCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) { }
  ta.remove();
}

function init() {
  load();
  if (!TEXT[state.lang] || !state.langSet) {
    state.lang = (navigator.language || 'en').toLowerCase().indexOf('de') === 0 ? 'de' : 'en';
  }

  // Vom Plugin geoeffnet: die Einrichtung laeuft schon, es fehlt nur noch Telegram.
  var fromPlugin = /[?&]pair=([a-f0-9]{32})(?:&|$)/.exec(location.search);
  if (fromPlugin) {
    state.token = fromPlugin[1];
    state.tokenAt = Date.now();
    state.downloaded = true;
    state.key = '';
    state.tested = false;
    live.plugin = true;
    save();
    try { history.replaceState(null, '', location.pathname); } catch (e) { }
  }

  if (CONFIG.privacy) { $('#a-privacy').href = CONFIG.privacy; show('#a-privacy', true); }
  if (CONFIG.imprint) { $('#a-imprint').href = CONFIG.imprint; show('#a-imprint', true); }
  if (CONFIG.source) { $('#a-source').href = CONFIG.source; show('#a-source', true); }
  applyTexts();

  all('.lang button').forEach(function (b) {
    b.addEventListener('click', function () { state.lang = b.dataset.lang; state.langSet = true; save(); applyTexts(); });
  });
  $('#b-download').addEventListener('click', download);
  $('#b-fb-next').addEventListener('click', fallbackDone);
  $('#p-code').addEventListener('submit', confirmCode);
  $('#code').addEventListener('input', function () {
    if (this.value.replace(/\D/g, '').length === 4) {
      if ($('#p-code').requestSubmit) $('#p-code').requestSubmit(); else confirmCode(new Event('submit'));
    }
  });
  $('#b-test').addEventListener('click', sendTest);
  $('#b-yes').addEventListener('click', testArrived);
  $('#b-no').addEventListener('click', function () { $('#d-help4').open = true; $('#d-help4 summary').focus(); });
  $('#b-reset').addEventListener('click', resetAll);
  all('[data-reopen]').forEach(function (b) {
    b.addEventListener('click', function () { live.open = Number(b.dataset.reopen); render(); focusStep(live.open); });
  });
  all('[data-next]').forEach(function (b) { b.addEventListener('click', function () { advance(''); }); });
  all('[data-copy]').forEach(function (b) { b.addEventListener('click', function () { copyFrom(b); }); });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { pollPair(); if (state.key && !live.seen) pollStatus(); }
  });

  // Dienst pruefen, gespeicherten Stand wieder aufnehmen
  api('info').then(function (r) {
    if (!r.ok) {
      alertBox(r.error === 'offline' ? 'err.offline' : 'err.setup');
      $('#b-download').disabled = true;
      return;
    }
    live.bot = r.bot;
    live.latest = r.latest;
    applyTexts();
    if (state.key) {
      live.linkSince = Date.now();
      pollStatus();
    } else if (state.token) {
      pollPair();
    }
  });
}

init();
})();
</script>
</body>
</html>
